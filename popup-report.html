<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; padding: 16px; color: #172b4d; box-sizing: border-box; display: flex; flex-direction: column; }
    h3 { margin: 18px 0 8px; font-size: 14px; color: #44546f; text-transform: uppercase; letter-spacing: .03em; }
    h3:first-of-type { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid #f0f1f2; }
    th { color: #6b778c; font-weight: 500; }
    td.num, th.num { text-align: right; }
    .grand { font-size: 15px; margin: 14px 0; padding: 10px; background: #f4f5f7; border-radius: 4px; }
    .grand strong { font-size: 20px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .refresh { flex: 1; padding: 8px 14px; font-size: 13px; border: 1px solid #dcdfe4; border-radius: 4px; background: white; cursor: pointer; }
    .refresh:hover { background: #f4f5f7; }
    .refresh.primary { background: #0c66e4; color: white; border-color: #0c66e4; }
    .refresh.primary:hover { background: #0055cc; }
    .scroll-area { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
    .authbox { text-align: center; padding: 30px 10px; }
    .authbox button { padding: 10px 18px; font-size: 14px; border: none; border-radius: 4px; background: #0c66e4; color: white; cursor: pointer; }
    .authbox button:hover { background: #0055cc; }
    .authbox p { color: #44546f; font-size: 13px; }
    .loading { text-align: center; padding: 30px; color: #6b778c; }
    .nodata { color: #6b778c; font-style: italic; }
  </style>
</head>
<body>
  <div id="app"><div class="loading">Loading…</div></div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <script>
    var t = window.TrelloPowerUp.iframe({
      appKey: TIME_TRACKER_CONFIG.APP_KEY,
      appName: TIME_TRACKER_CONFIG.APP_NAME
    });
    var app = document.getElementById("app");

    function h(tag, attrs, children) {
      var el = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        if (k === "text") el.textContent = attrs[k];
        else if (k === "class") el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      });
      (children || []).forEach(function (c) { el.appendChild(c); });
      return el;
    }

    // Extract {estimate, spent} from a card's pluginData array.
    // Doesn't match on idPlugin so it keeps working even if you change
    // your Power-Up's App Key later - just looks for the shape of our data.
    function extractTimeData(card) {
      var estimate = 0, spent = 0, lastCommentSync = null, lastEstimateCommentSync = null;
      (card.pluginData || []).forEach(function (pd) {
        var val;
        try { val = JSON.parse(pd.value); } catch (e) { return; }
        if (val && (typeof val.estimate !== "undefined" || typeof val.spent !== "undefined")) {
          estimate += parseFloat(val.estimate) || 0;
          spent += parseFloat(val.spent) || 0;
          if (val.lastCommentSync) lastCommentSync = val.lastCommentSync;
          if (val.lastEstimateCommentSync) lastEstimateCommentSync = val.lastEstimateCommentSync;
        }
      });
      return {
        estimate: estimate, spent: spent,
        lastCommentSync: lastCommentSync, lastEstimateCommentSync: lastEstimateCommentSync
      };
    }

    var TIME_COMMENT_RE = /#time\s+([\d.:]+)\s*(h|hr|hrs|m|min|mins)?/i;
    var ESTIMATE_COMMENT_RE = /#estimate\s+([\d.:]+)\s*(h|hr|hrs|m|min|mins)?/i;

    function parseHours(raw, unit) {
      unit = (unit || "h").toLowerCase();
      if (raw.indexOf(":") > -1) {
        var parts = raw.split(":");
        return (parseFloat(parts[0]) || 0) + (parseFloat(parts[1]) || 0) / 60;
      }
      var n = parseFloat(raw);
      if (isNaN(n)) return 0;
      return unit[0] === "m" ? n / 60 : n;
    }

    // Merges each card's stored pluginData with any #time/#estimate comments
    // posted AFTER that card's last sync marker, so the report is accurate
    // even for cards nobody's opened since commenting. commentsByCard maps
    // cardId -> array of {date, text} from a single board-wide fetch.
    function liveTimeData(card, commentsByCard) {
      var base = extractTimeData(card);
      var comments = (commentsByCard[card.id] || []).slice().sort(function (a, b) {
        return new Date(a.date) - new Date(b.date);
      });

      var estimate = base.estimate, spent = base.spent;

      comments.forEach(function (c) {
        if (base.lastCommentSync && new Date(c.date) <= new Date(base.lastCommentSync)) return;
        var m = c.text.match(TIME_COMMENT_RE);
        if (m) spent += parseHours(m[1], m[2]);
      });

      var latestEstimate = null;
      comments.forEach(function (c) {
        if (base.lastEstimateCommentSync && new Date(c.date) <= new Date(base.lastEstimateCommentSync)) return;
        var m = c.text.match(ESTIMATE_COMMENT_RE);
        if (m) latestEstimate = { date: c.date, hours: parseHours(m[1], m[2]) };
      });
      if (latestEstimate) estimate = latestEstimate.hours;

      return { estimate: estimate, spent: spent };
    }

    function dueBucket(due) {
      if (!due) return "No due date";
      var d = new Date(due);
      var now = new Date();
      var days = (d - now) / 86400000;
      if (days < 0) return "Overdue";
      if (days <= 7) return "Due within 7 days";
      if (days <= 30) return "Due within 8\u201330 days";
      return "Due later than 30 days";
    }

    function round(n) { return Math.round(n * 100) / 100; }

    function renderGroupTable(title, groupTotals, order) {
      var keys = order || Object.keys(groupTotals).sort(function (a, b) {
        return groupTotals[b].estimate - groupTotals[a].estimate;
      });
      var rows = keys
        .filter(function (k) { return groupTotals[k]; })
        .map(function (k) {
          var g = groupTotals[k];
          return h("tr", {}, [
            h("td", { text: k }),
            h("td", { class: "num", text: round(g.estimate) + "h" }),
            h("td", { class: "num", text: round(g.spent) + "h" })
          ]);
        });
      if (rows.length === 0) {
        return h("div", {}, [
          h("h3", { text: title }),
          h("p", { class: "nodata", text: "No cards with time data yet." })
        ]);
      }
      return h("div", {}, [
        h("h3", { text: title }),
        h("table", {}, [
          h("tr", {}, [
            h("th", { text: "" }),
            h("th", { class: "num", text: "Estimated" }),
            h("th", { class: "num", text: "Spent" })
          ])
        ].concat(rows))
      ]);
    }

    var DUE_BUCKET_ORDER = ["Overdue", "Due within 7 days", "Due within 8\u201330 days", "Due later than 30 days", "No due date"];

    // All fetched data lives here so filter/group-by changes can re-render
    // without re-fetching. Repopulated fresh each time loadReport() runs.
    var STATE = {
      cards: [], listMap: {}, listOrder: [], commentsByCard: {},
      labelFilter: "All", groupBy: "list"
    };

    function distinctLabelNames(cards) {
      var seen = {};
      cards.forEach(function (card) {
        (card.labels || []).forEach(function (l) {
          seen[l.name || l.color || "(unnamed label)"] = true;
        });
      });
      return Object.keys(seen).sort();
    }

    function cardMatchesLabelFilter(card, filter) {
      if (filter === "All") return true;
      if (filter === "(no label)") return !(card.labels && card.labels.length);
      return (card.labels || []).some(function (l) { return (l.name || l.color) === filter; });
    }

    // Aggregates a set of cards into by-list/by-label/by-due-date totals,
    // a grand total, and total remaining (estimate minus spent, floored at 0).
    function computeAggregates(cards) {
      var byList = {}, byLabel = {}, byDue = {};
      var grandEst = 0, grandSpent = 0, totalRemaining = 0, touched = 0;

      cards.forEach(function (card) {
        var td = liveTimeData(card, STATE.commentsByCard);
        if (td.estimate === 0 && td.spent === 0) return; // skip untouched cards
        touched++;

        grandEst += td.estimate;
        grandSpent += td.spent;
        totalRemaining += Math.max(0, td.estimate - td.spent);

        var listName = STATE.listMap[card.idList] || "(unknown list)";
        byList[listName] = byList[listName] || { estimate: 0, spent: 0 };
        byList[listName].estimate += td.estimate;
        byList[listName].spent += td.spent;

        if (card.labels && card.labels.length) {
          card.labels.forEach(function (lbl) {
            var name = lbl.name || lbl.color || "(unnamed label)";
            byLabel[name] = byLabel[name] || { estimate: 0, spent: 0 };
            byLabel[name].estimate += td.estimate;
            byLabel[name].spent += td.spent;
          });
        } else {
          byLabel["(no label)"] = byLabel["(no label)"] || { estimate: 0, spent: 0 };
          byLabel["(no label)"].estimate += td.estimate;
          byLabel["(no label)"].spent += td.spent;
        }

        var bucket = dueBucket(card.due);
        byDue[bucket] = byDue[bucket] || { estimate: 0, spent: 0 };
        byDue[bucket].estimate += td.estimate;
        byDue[bucket].spent += td.spent;
      });

      return { byList: byList, byLabel: byLabel, byDue: byDue, grandEst: grandEst, grandSpent: grandSpent, totalRemaining: totalRemaining, touched: touched };
    }

    function renderReport() {
      var filteredCards = STATE.cards.filter(function (c) { return cardMatchesLabelFilter(c, STATE.labelFilter); });
      var agg = computeAggregates(filteredCards);

      app.innerHTML = "";

      // --- Filter / group-by row ---
      var labelOptions = ["All"].concat(distinctLabelNames(STATE.cards));
      var labelSelect = h("select", { class: "refresh" });
      labelOptions.forEach(function (name) {
        var opt = h("option", { text: name });
        opt.value = name;
        if (name === STATE.labelFilter) opt.selected = true;
        labelSelect.appendChild(opt);
      });
      labelSelect.addEventListener("change", function () {
        STATE.labelFilter = labelSelect.value;
        renderReport();
      });

      var groupOptions = [["list", "Group by: List"], ["label", "Group by: Label"], ["due", "Group by: Due date"]];
      var groupSelect = h("select", { class: "refresh" });
      groupOptions.forEach(function (pair) {
        var opt = h("option", { text: pair[1] });
        opt.value = pair[0];
        if (pair[0] === STATE.groupBy) opt.selected = true;
        groupSelect.appendChild(opt);
      });
      groupSelect.addEventListener("change", function () {
        STATE.groupBy = groupSelect.value;
        renderReport();
      });

      var filterRow = h("div", { class: "toolbar" }, [labelSelect, groupSelect]);
      app.appendChild(filterRow);

      // --- Action row ---
      var toolbar = h("div", { class: "toolbar" }, [
        h("button", { class: "refresh primary", text: "⬇ Download CSV" }),
        h("button", { class: "refresh", text: "↻ Refresh" })
      ]);
      toolbar.children[0].addEventListener("click", function () {
        downloadCsv(STATE.cards, STATE.listMap, STATE.commentsByCard);
      });
      toolbar.children[1].addEventListener("click", loadReport);
      app.appendChild(toolbar);

      var scrollArea = h("div", { class: "scroll-area" });

      var filterNote = STATE.labelFilter === "All" ? "" : " (filtered: " + STATE.labelFilter + ")";
      scrollArea.appendChild(
        h("div", { class: "grand" }, [
          document.createTextNode("Across " + agg.touched + " cards" + filterNote + ": "),
          h("strong", { text: round(agg.grandEst) + "h estimated" }),
          document.createTextNode(" / " + round(agg.grandSpent) + "h spent / "),
          h("strong", { text: round(agg.totalRemaining) + "h remaining" })
        ])
      );

      if (STATE.groupBy === "list") {
        scrollArea.appendChild(renderGroupTable("By list", agg.byList, STATE.listOrder.filter(function (n) { return agg.byList[n]; })));
      } else if (STATE.groupBy === "label") {
        scrollArea.appendChild(renderGroupTable("By label", agg.byLabel));
      } else {
        scrollArea.appendChild(renderGroupTable("By due date", agg.byDue, DUE_BUCKET_ORDER));
      }

      app.appendChild(scrollArea);
    }

    function csvField(v) {
      v = (v === null || v === undefined) ? "" : String(v);
      if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    }

    function downloadCsv(cards, listMap, commentsByCard) {
      var header = ["Card", "List", "Labels", "Due Date", "Estimated Hours", "Spent Hours"];
      var rows = [header];

      cards.forEach(function (card) {
        var td = liveTimeData(card, commentsByCard);
        var listName = listMap[card.idList] || "";
        var labelNames = (card.labels || []).map(function (l) { return l.name || l.color || ""; }).join("; ");
        var due = card.due ? card.due.slice(0, 10) : "";
        rows.push([
          card.name,
          listName,
          labelNames,
          due,
          td.estimate || "",
          td.spent || ""
        ]);
      });

      var csv = rows.map(function (r) { return r.map(csvField).join(","); }).join("\r\n");
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "trello-time-report-" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function loadReport() {
      app.innerHTML = "";
      app.appendChild(h("div", { class: "loading", text: "Loading…" }));

      Promise.all([
        t.board("id"),
        t.lists("all"),
        t.getRestApi().getToken()
      ]).then(function (results) {
        var boardId = results[0].id;
        var lists = results[1];
        var token = results[2];
        var cardsUrl =
          "https://api.trello.com/1/boards/" + boardId +
          "/cards?fields=name,idList,labels,due&pluginData=true" +
          "&key=" + TIME_TRACKER_CONFIG.APP_KEY + "&token=" + token;
        var commentsUrl =
          "https://api.trello.com/1/boards/" + boardId +
          "/actions?filter=commentCard&limit=1000&fields=data,date" +
          "&key=" + TIME_TRACKER_CONFIG.APP_KEY + "&token=" + token;

        function fetchJson(u) {
          return fetch(u).then(function (res) {
            if (!res.ok) {
              return res.text().then(function (body) {
                throw new Error("Trello API error " + res.status + ": " + body);
              });
            }
            return res.json();
          });
        }

        return Promise.all([fetchJson(cardsUrl), fetchJson(commentsUrl)]).then(function (r) {
          var cards = r[0], actions = r[1];
          var commentsByCard = {};
          actions.forEach(function (a) {
            var cardId = a.data && a.data.card && a.data.card.id;
            var text = a.data && a.data.text;
            if (!cardId || !text) return;
            (commentsByCard[cardId] = commentsByCard[cardId] || []).push({ date: a.date, text: text });
          });

          STATE.cards = cards;
          STATE.listOrder = lists.map(function (l) { return l.name; });
          STATE.listMap = {};
          lists.forEach(function (l) { STATE.listMap[l.id] = l.name; });
          STATE.commentsByCard = commentsByCard;

          renderReport();
        });
      }).catch(function (err) {
        app.innerHTML = "";
        app.appendChild(h("p", { class: "nodata", text: "Couldn't load the report: " + err.message }));
      });
    }

    function showAuthPrompt() {
      app.innerHTML = "";
      app.appendChild(
        h("div", { class: "authbox" }, [
          h("p", { text: "This report reads estimated/spent hours across every card on the board, so it needs one-time read-only access." }),
          h("button", { text: "Authorize read access" })
        ])
      );
      app.querySelector("button").addEventListener("click", function () {
        t.getRestApi().authorize({ scope: "read", expiration: "never" }).then(function () {
          loadReport();
        });
      });
    }

    t.getRestApi().isAuthorized().then(function (isAuthorized) {
      if (isAuthorized) loadReport();
      else showAuthPrompt();
    });

    t.render(function () {
      t.sizeTo(560).done();
    });
  </script>
</body>
</html>
